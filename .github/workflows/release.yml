name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify version and build userscript
        run: |
          node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) throw new Error("Tag and package versions must match")'
          npm run build-prod
          cp dist/ehunter.iife.js dist/ehunter.user.js
          node --check dist/ehunter.user.js
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/ehunter.user.js dist/ehunter.iife.js \
            --verify-tag --latest \
            --title "eHunter $GITHUB_REF_NAME" \
            --notes-file "misc/release-notes/$GITHUB_REF_NAME.md"
